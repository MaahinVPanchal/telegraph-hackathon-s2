<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miner rank history | LeaderLight</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #100b17; color: #f6efff; }
  main { max-width: 70rem; margin: 3rem auto; padding: 0 1rem; }
  a { color: #dbc1ff; }
  h1 { font-size: clamp(2rem, 6vw, 4rem); margin-bottom: .5rem; }
  p { color: #d2c3e2; line-height: 1.5; }
  .filters { display: flex; flex-wrap: wrap; gap: 1rem; margin: 2rem 0 1rem; }
  label { display: grid; gap: .4rem; max-width: 100%; }
  select { width: 100%; min-height: 44px; background: #22172f; color: inherit; border: 1px solid #73598b; border-radius: .4rem; padding: .4rem; font: inherit; }
  .scroll { overflow: auto; background: #191122; border: 1px solid #4a365e; border-radius: .6rem; margin-bottom: 1rem; }
  canvas { display: block; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  caption, th, td { padding: .7rem; }
  caption { text-align: left; font-weight: bold; }
  th, td { border-top: 1px solid #4a365e; }
  td:first-child { white-space: nowrap; }
</style>
<main>
  <a href="/">← Back to LeaderLight</a>
  <h1>Miner rank history</h1>
  <p>Latest recorded rank per UTC day for the selected Intent. Rank #1 is highest. Gaps indicate days with no available score.</p>
  <div class="filters">
    <label>Miner
      <select id="miner">
        <option value="onchain-metric-publicnode">On-chain metrics</option>
        <option value="weather-verify-openmeteo">Weather verification</option>
        <option value="fx-now-frankfurter">FX rates</option>
      </select>
    </label>
    <label>Intent <select id="intent" disabled></select></label>
  </div>
  <p id="status" role="status"></p>
  <section id="history" hidden>
    <div class="scroll" tabindex="0" role="region" aria-label="Scrollable daily rank chart">
      <canvas id="chart" aria-hidden="true"></canvas>
    </div>
    <div class="scroll">
      <table>
        <caption>Daily observations</caption>
        <thead><tr><th scope="col">Date (UTC)</th><th scope="col">Rank</th><th scope="col">Score</th><th scope="col">Epoch</th></tr></thead>
        <tbody id="observations"></tbody>
      </table>
    </div>
  </section>
  <p>Source: <a id="source" href="https://anjoman.ai/">Anjoman Explorer scores</a></p>
</main>
<script type="module" src="/miner-history.mjs"></script>
</html>
